<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- stacked pages icon in walnut brown on cream -->
  <rect width="32" height="32" rx="7" fill="#f5f5f0"/>
  <!-- back page -->
  <rect x="9" y="7" width="16" height="20" rx="2" fill="#c8b89e" stroke="#7a6248" stroke-width="1"/>
  <!-- middle page -->
  <rect x="7" y="5" width="16" height="20" rx="2" fill="#ece4d8" stroke="#7a6248" stroke-width="1"/>
  <!-- front page -->
  <rect x="5" y="3" width="16" height="20" rx="2" fill="#f5f5f0" stroke="#7a6248" stroke-width="1.5"/>
  <!-- lines suggesting text -->
  <line x1="8" y1="9"  x2="18" y2="9"  stroke="#7a6248" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="8" y1="12" x2="18" y2="12" stroke="#b09a7a" stroke-width="1"   stroke-linecap="round"/>
  <line x1="8" y1="15" x2="14" y2="15" stroke="#b09a7a" stroke-width="1"   stroke-linecap="round"/>
  <!-- merge arrow -->
  <path d="M20 19 L26 19 M24 17 L26 19 L24 21" stroke="#7a6248" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
